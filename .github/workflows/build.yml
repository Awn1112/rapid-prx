name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld unzip
          mkdir -p $HOME/ps4toolchain tc
          cd tc
          curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | jq -r '.assets[].browser_download_url' > urls.txt
          cat urls.txt
          while read u; do curl -sLO "$u"; done < urls.txt
          ls -la
          for f in *.tar.gz; do [ -e "$f" ] && tar xzf "$f" -C $HOME/ps4toolchain; done
          for f in *.zip; do [ -e "$f" ] && unzip -q "$f" -d $HOME/ps4toolchain; done
          LINUXBIN=$(find $HOME/ps4toolchain -type d -path '*bin/linux' | head -1)
          TC=$(dirname $(dirname "$LINUXBIN"))
          chmod +x "$LINUXBIN"/*
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: rapid-prx
          path: rapid.prx
