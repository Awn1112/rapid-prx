name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: OpenOrbis/toolchain-action@main
        with:
          version: latest
          command: make
      - uses: actions/upload-artifact@v4
        with:
          name: rapid-prx
          path: rapid.prx
